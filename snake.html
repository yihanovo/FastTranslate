<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #00e5ff;
    --accent2: #ff4081;
    --gold: #ffd54f;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(0,229,255,0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,64,129,0.15), transparent 40%),
      linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    font-family: "Microsoft YaHei", sans-serif;
    color: #fff;
    user-select: none;
    overflow: hidden;
    position: relative;
  }
  /* 背景动态光斑 */
  body::before {
    content: '';
    position: fixed;
    inset: -50%;
    background:
      radial-gradient(circle at 30% 40%, rgba(0,229,255,0.08), transparent 30%),
      radial-gradient(circle at 70% 60%, rgba(255,64,129,0.08), transparent 30%);
    animation: drift 20s linear infinite;
    z-index: 0;
  }
  @keyframes drift {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .wrap {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin-bottom: 16px;
    font-size: 32px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00e5ff, #ffd54f, #ff4081);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,229,255,0.3));
  }
  .info {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
  }
  .card {
    padding: 10px 22px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    font-size: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .card .num {
    font-weight: bold;
    font-size: 20px;
    margin-left: 8px;
  }
  .card.score .num { color: var(--accent); }
  .card.best .num { color: var(--gold); }
  .board {
    position: relative;
    padding: 8px;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 10px 40px rgba(0,0,0,0.45);
  }
  canvas {
    display: block;
    background:
      radial-gradient(circle at 50% 50%, #152238, #0a1520);
    border-radius: 10px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
  }
  .tips {
    margin-top: 16px;
    font-size: 13px;
    opacity: 0.75;
    text-align: center;
    letter-spacing: 1px;
  }
  .tips kbd {
    display: inline-block;
    padding: 2px 8px;
    margin: 0 2px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
  }
  .overlay {
    position: absolute;
    inset: 8px;
    border-radius: 10px;
    background: rgba(10,21,32,0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 2;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 34px;
    background: linear-gradient(90deg, #00e5ff, #ff4081);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .overlay p { font-size: 16px; opacity: 0.9; }
  .btn {
    padding: 12px 32px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg, #00e5ff, #2196f3);
    color: #fff;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
    box-shadow: 0 6px 20px rgba(0,229,255,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 10px 28px rgba(0,229,255,0.6);
  }
  .btn:active { transform: translateY(0) scale(0.98); }
  .pause-tag {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    color: var(--gold);
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    z-index: 2;
    pointer-events: none;
  }
  .pause-tag.hidden { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🐍 贪吃蛇</h1>
    <div class="info">
      <div class="card score">得分<span class="num" id="score">0</span></div>
      <div class="card best">最高分<span class="num" id="best">0</span></div>
    </div>
    <div class="board">
      <canvas id="game" width="400" height="400"></canvas>
      <div class="pause-tag hidden" id="pauseTag">⏸ 已暂停</div>
      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">准备好了吗？</h2>
        <p id="overlayText">按方向键或点击下方开始</p>
        <button class="btn" id="startBtn">开始游戏</button>
      </div>
    </div>
    <div class="tips">
      <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>空格</kbd> 暂停 · <kbd>回车</kbd> 重开
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const pauseTag = document.getElementById('pauseTag');

  const GRID = 20;
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  let snake, dir, nextDir, food, score, best, speed, timer, running, paused;
  let pulse = 0; // 食物脉动动画相位

  best = +localStorage.getItem('snakeBest') || 0;
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = 130;
    scoreEl.textContent = score;
    spawnFood();
    running = true;
    paused = false;
    pauseTag.classList.add('hidden');
    if (timer) clearInterval(timer);
    timer = setInterval(loop, speed);
    requestAnimationFrame(animLoop);
  }

  function spawnFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function loop() {
    if (paused || !running) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      spawnFood();
      if (score % 50 === 0 && speed > 60) {
        speed -= 10;
        clearInterval(timer);
        timer = setInterval(loop, speed);
      }
    } else {
      snake.pop();
    }
  }

  // 持续刷新动画（用于食物脉动）
  function animLoop() {
    if (!running) return;
    pulse += 0.1;
    draw();
    requestAnimationFrame(animLoop);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    // 背景渐变
    const bg = ctx.createRadialGradient(
      canvas.width/2, canvas.height/2, 0,
      canvas.width/2, canvas.height/2, canvas.width/1.2
    );
    bg.addColorStop(0, '#152238');
    bg.addColorStop(1, '#0a1520');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height);
      ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }

    // 食物（发光脉动）
    const fx = food.x * GRID + GRID/2;
    const fy = food.y * GRID + GRID/2;
    const baseR = GRID/2 - 3;
    const r = baseR + Math.sin(pulse) * 1.5;
    // 光晕
    const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, baseR * 2.2);
    glow.addColorStop(0, 'rgba(255,82,82,0.55)');
    glow.addColorStop(1, 'rgba(255,82,82,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(fx, fy, baseR * 2.2, 0, Math.PI * 2);
    ctx.fill();
    // 主体
    const grad = ctx.createRadialGradient(fx - 2, fy - 2, 0, fx, fy, r);
    grad.addColorStop(0, '#ff8a80');
    grad.addColorStop(1, '#ff1744');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(fx, fy, r, 0, Math.PI * 2);
    ctx.fill();

    // 蛇（渐变 + 圆角 + 头部高光）
    snake.forEach((s, i) => {
      const x = s.x * GRID + 1.5;
      const y = s.y * GRID + 1.5;
      const size = GRID - 3;
      const isHead = i === 0;
      // 颜色从青色头部渐变到尾部
      const t = i / Math.max(snake.length - 1, 1);
      const r1 = Math.round(0 + (0 - 0) * t);
      const g1 = Math.round(229 - (229 - 100) * t);
      const b1 = Math.round(255 - (255 - 200) * t);
      ctx.fillStyle = `rgb(${r1},${g1},${b1})`;
      if (isHead) {
        // 头部光晕
        ctx.shadowColor = 'rgba(0,229,255,0.8)';
        ctx.shadowBlur = 12;
      } else {
        ctx.shadowBlur = 0;
      }
      roundRect(x, y, size, size, 5);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 头部眼睛
      if (isHead) {
        ctx.fillStyle = '#0a1520';
        const ex = s.x * GRID + GRID/2;
        const ey = s.y * GRID + GRID/2;
        const off = 3;
        // 根据方向画眼睛
        let e1, e2;
        if (dir.x === 1)      { e1 = [ex+off, ey-off]; e2 = [ex+off, ey+off]; }
        else if (dir.x === -1){ e1 = [ex-off, ey-off]; e2 = [ex-off, ey+off]; }
        else if (dir.y === 1) { e1 = [ex-off, ey+off]; e2 = [ex+off, ey+off]; }
        else                  { e1 = [ex-off, ey-off]; e2 = [ex+off, ey-off]; }
        ctx.beginPath();
        ctx.arc(e1[0], e1[1], 1.6, 0, Math.PI*2);
        ctx.arc(e2[0], e2[1], 1.6, 0, Math.PI*2);
        ctx.fill();
      }
    });
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = '游戏结束';
    overlayText.textContent = `本次得分：${score}`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function setDir(x, y) {
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','w'].includes(k)) setDir(0, -1);
    else if (['arrowdown','s'].includes(k)) setDir(0, 1);
    else if (['arrowleft','a'].includes(k)) setDir(-1, 0);
    else if (['arrowright','d'].includes(k)) setDir(1, 0);
    else if (k === ' ') {
      if (running) {
        paused = !paused;
        pauseTag.classList.toggle('hidden', !paused);
      }
      e.preventDefault();
    }
    else if (k === 'enter') { if (!running) startGame(); }
  });

  function startGame() {
    overlay.classList.add('hidden');
    reset();
  }

  startBtn.addEventListener('click', startGame);

  // 初始绘制
  snake = [{ x: 10, y: 10 }];
  food = { x: 5, y: 5 };
  draw();
})();
</script>
</body>
</html>
